name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Swift ${{ matrix.swift }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        swift: ["6.0", "6.2"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ matrix.swift }}

      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test

  test-consumer-toolchain:
    name: Test (Swift 6.3, the toolchain consumers actually use)
    runs-on: ubuntu-latest
    container: swift:6.3.3
    # The matrix above covers this package's declared floor — 6.0 — and 6.2,
    # which is right for what it promises. It cannot cover 6.3:
    # swift-actions/setup-swift only indexes up to 6.2, so adding "6.3" there
    # fails to install rather than failing to compile.
    #
    # Every consumer builds this package on 6.3 or later; alula-data declares
    # swift-tools-version 6.3. Without this job a 6.3-only break reaches them
    # with every check here green. A container sidesteps the indexing limit.
    steps:
      - uses: actions/checkout@v4

      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      # Fails the job on any DocC warning, so a broken symbol link or an
      # unresolved guide reference cannot land on main.
      - name: Generate documentation
        env:
          SWIFT_CHANGESET_BUILD_DOCS: "1"
        run: |
          swift package --allow-writing-to-directory ./docs \
            generate-documentation --target Changesets \
            --warnings-as-errors --output-path ./docs
